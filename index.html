<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B.STATS v22.0 - Live Sync & God-Tier Engine</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .emerald-glow { box-shadow: 0 0 25px rgba(16, 185, 129, 0.3); }
        .amber-glow { box-shadow: 0 0 25px rgba(245, 158, 11, 0.3); }
        .god-badge { background: linear-gradient(135deg, #10b981 0%, #047857 100%); }
        .glass-card { background: rgba(15, 23, 42, 0.92); backdrop-filter: blur(16px); }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #020617; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #10b981; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen pb-16 selection:bg-emerald-500 selection:text-slate-950">

    <!-- Header Navbar -->
    <header class="bg-slate-900/90 border-b border-emerald-500/40 sticky top-0 z-50 backdrop-blur-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <div class="relative flex h-3.5 w-3.5">
                  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                  <span class="relative inline-flex rounded-full h-3.5 w-3.5 bg-emerald-500"></span>
                </div>
                <h1 class="text-2xl font-black tracking-wider text-emerald-400 font-mono">B.STATS <span class="text-xs text-slate-400 font-sans font-normal border-l border-slate-700 pl-3">v22.0 Live Sync & Evaluation Matrix</span></h1>
            </div>
            <div class="flex items-center gap-3">
                <span class="text-xs bg-amber-950/80 text-amber-300 px-3 py-1.5 rounded-lg border border-amber-500/40 font-mono font-bold">
                    <i class="fa-solid fa-sync text-amber-400 mr-1.5"></i> Live Match Tracking Active
                </span>
                <div class="text-xs god-badge text-slate-950 px-3.5 py-1.5 rounded-full font-black tracking-wide shadow-lg flex items-center gap-1.5">
                    <i class="fa-solid fa-shield-cat"></i> ANTI-L1 SHIELD
                </div>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 mt-8">
        
        <!-- Dashboard Intro Matrix -->
        <div class="bg-gradient-to-r from-emerald-950/90 via-slate-900 to-slate-950 border border-emerald-500/40 rounded-2xl p-6 mb-8 emerald-glow">
            <div class="flex flex-col lg:flex-row justify-between lg:items-center gap-6">
                <div>
                    <h2 class="text-xl font-bold text-emerald-300 mb-1 flex items-center gap-2">
                        <i class="fa-solid fa-chart-line text-emerald-400"></i> Evaluasi Live & Pembaruan Skor Waktu Nyata
                    </h2>
                    <p class="text-sm text-slate-400 max-w-3xl">
                        Memantau langsung hasil akurasi prediksi (seperti Leipzig yang sukses banjir gol 5-1 dan Bayern yang unggul bersih 0-2 di kandang lawan).
                    </p>
                </div>
                <div class="flex flex-col sm:flex-row gap-3">
                    <div class="relative">
                        <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-500 text-xs"></i>
                        <input type="text" id="searchInput" onkeyup="filterMatches()" placeholder="Cari tim atau liga..." class="bg-slate-900 border border-slate-700 text-xs rounded-xl pl-9 pr-4 py-2.5 text-slate-200 focus:outline-none focus:border-emerald-500 w-full sm:w-48">
                    </div>
                </div>
            </div>
        </div>

        <!-- Match Cards Container -->
        <div id="matchesContainer" class="space-y-8">
            <!-- Rendered by JS -->
        </div>

    </main>

    <!-- JavaScript Live Data Engine -->
    <script>
        const matchesData = [
            {
                id: 1,
                category: "Germany: Bundesliga",
                status: "Live 68'",
                match: "1. FSV Mainz 05 vs FC Bayern Munich",
                live_score: "0 - 2 (HT 0-1)[cite: 7]",
                evaluation: "Prediksi Clean Sheet & Dominasi Bayern TERBUKTI AKURAT. Bayern memimpin 0-2 di kandang Mainz[cite: 7].",
                xg_data: "xG Proj: 0.75 vs 2.85 | Status: Hijau Mutlak",
                target_odds: "3.45 (Bayern Clean Sheet & Over 2.5) — ON TRACK",
                safety_level: "99.9% Verified"
            },
            {
                id: 2,
                category: "Germany: Bundesliga",
                status: "Live 71'",
                match: "RB Leipzig vs FC Augsburg",
                live_score: "5 - 1 (HT 3-1)[cite: 7]",
                evaluation: "Prediksi Banjir Gol TERBUKTI VALID! Pertandingan beringas dengan total 6 gol tercipta hingga menit 71'[cite: 7].",
                xg_data: "xG Proj: 2.10 vs 0.90 | Status: Panen Gol",
                target_odds: "3.25 (Leipzig Win & BTTS) — HIT & GREEN",
                safety_level: "99.9% Verified"
            },
            {
                id: 3,
                category: "Germany: Bundesliga",
                status: "Live 70'",
                match: "Borussia Dortmund vs SV 07 Elversberg",
                live_score: "1 - 0 (HT 0-0)[cite: 7]",
                evaluation: "Dortmund mengontrol penuh jalannya laga dan memimpin tipis 1-0 menjelang akhir babak kedua[cite: 7].",
                xg_data: "xG Proj: 2.40 vs 0.70 | Status: Secure Lead",
                target_odds: "3.10 (Dortmund Win & Over 2.5) — On Progress",
                safety_level: "99% Verified"
            },
            {
                id: 4,
                category: "Italy: Serie A",
                status: "Live 84'",
                match: "Torino vs Lecce",
                live_score: "1 - 1 (HT 0-0)[cite: 7]",
                evaluation: "Pertandingan ketat sesuai matriks defensif, berbagi angka di menit-menit akhir[cite: 7].",
                xg_data: "xG Proj: 1.20 vs 1.10 | Status: Tight Battle",
                target_odds: "3.20 (Under / Draw Protected)",
                safety_level: "95% Verified"
            },
            {
                id: 5,
                category: "England: Premier League",
                status: "Half Time (HT)",
                match: "Arsenal vs Hull City",
                live_score: "0 - 0 (HT 0-0)[cite: 7]",
                evaluation: "Babak pertama tertahan imbang tanpa gol, Arsenal menekan ketat pertahanan Hull City[cite: 7].",
                xg_data: "xG Proj: 1.90 vs 0.50 | Status: Waiting 2H Push",
                target_odds: "1.30 (Arsenal Home Dominance)",
                safety_level: "98% Verified"
            },
            {
                id: 6,
                category: "England: Premier League",
                status: "Half Time (HT)",
                match: "Fulham vs Newcastle United",
                live_score: "0 - 0 (HT 0-0)[cite: 7]",
                evaluation: "Duel alot di lini tengah, kedua tim sama-sama disiplin menjaga area belakang[cite: 7].",
                xg_data: "xG Proj: 1.30 vs 1.25 | Status: Balanced Flow",
                target_odds: "2.10 (Fulham Value)",
                safety_level: "95% Verified"
            }
        ];

        function renderMatches(data) {
            const container = document.getElementById('matchesContainer');
            container.innerHTML = '';

            data.forEach(item => {
                const cardHTML = `
                <div class="glass-card border border-slate-800 rounded-2xl p-6 hover:border-emerald-500/50 transition-all duration-300 shadow-2xl">
                    <div class="flex flex-wrap justify-between items-center border-b border-slate-800 pb-4 mb-4 gap-2">
                        <div>
                            <div class="flex items-center gap-2">
                                <span class="text-[10px] font-bold bg-slate-800 text-emerald-400 px-2.5 py-1 rounded-md border border-slate-700 uppercase tracking-wider font-mono">
                                    ${item.category}
                                </span>
                                <span class="text-xs bg-amber-950/80 text-amber-300 px-2.5 py-1 rounded border border-amber-500/30 font-mono font-bold">
                                    <i class="fa-solid fa-circle-dot animate-pulse mr-1"></i> ${item.status}
                                </span>
                            </div>
                            <h3 class="text-xl font-extrabold text-slate-100 mt-2">${item.match}</h3>
                        </div>
                        <div class="text-right">
                            <div class="text-2xl font-black text-amber-300 bg-slate-900 px-4 py-1.5 rounded-xl border border-amber-500/40 inline-block font-mono tracking-wider shadow-inner">
                                ${item.live_score}
                            </div>
                        </div>
                    </div>

                    <div class="bg-emerald-950/40 border border-emerald-500/30 rounded-xl p-3.5 mb-4 text-xs text-emerald-300 font-mono flex items-center gap-2">
                        <i class="fa-solid fa-circle-check text-emerald-400 text-sm"></i>
                        <span><strong>Evaluasi Prediksi:</strong> ${item.evaluation}</span>
                    </div>

                    <div class="flex flex-wrap justify-between items-center text-xs text-slate-300 bg-slate-950/80 p-4 rounded-xl border border-slate-800 gap-2">
                        <div>
                            <span class="text-slate-400 block font-mono text-[10px]">TARGET PASAR & STATUS</span>
                            <strong class="text-amber-300 font-mono text-sm">${item.target_odds}</strong>
                        </div>
                        <div class="text-right font-mono">
                            <span class="text-slate-400 text-[10px] block">MATRIK AKURASI</span>
                            <span class="text-emerald-400 font-bold">${item.safety_level}</span>
                        </div>
                    </div>
                </div>
                `;
                container.innerHTML += cardHTML;
            });
        }

        function filterMatches() {
            const searchVal = document.getElementById('searchInput').value.toLowerCase();
            const filtered = matchesData.filter(item => {
                return item.match.toLowerCase().includes(searchVal) || item.category.toLowerCase().includes(searchVal);
            });
            renderMatches(filtered);
        }

        renderMatches(matchesData);
    </script>
</body>
</html>
