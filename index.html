                corner: "Over 8.5 Total Corner", cornerDesc: "Banyak blok tembakan dari pertahanan rapat Machida.",
                pick: "Machida Zelvia Win (DNB)", pickOdds: "1.40",
                bestOption1: "Opsi 1 (Safety): Machida Zelvia Win (1X2) - Odds 1.90",
                bestOption2: "Opsi 2 (Under): Under 2.5 Total Goals - Odds 1.70",
                scoreMain: "1 - 0", scoreAlt: "2 - 0",
                motivation: "Machida fokus pada efisiensi taktik dan tidak mau kebobolan.",
                htStrategy: "Machida disiplin menjaga jarak antar lini secara sangat terstruktur.",
                htPossession: "53% vs 47%", htShotsOnTarget: "2 vs 1", htCorners: "2 vs 1", htExpectedGoals: "0.50 vs 0.30"
            },
            // 19. Svay Rieng vs Tampines Rovers
            {
                id: 19, league: "AFC Champions League Two - Group G", time: "7:15 PM",
                home: "Preah Khan Reach Svay Rieng", away: "Tampines Rovers", odds: "2.50 | 3.50 | 2.40",
                btts: "88% High", bttsDesc: "Dua klub Asia Tenggara yang selalu main terbuka.",
                htOu: "HT: Over 1.0", ftOu: "FT: Over 2.5/3.0", ouDesc: "Saling balas serangan sejak awal.",
                corner: "Over 9.5 Total Corner", cornerDesc: "Laga sangat dinamis memicu bola keluar.",
                pick: "Both Teams To Score (BTTS Yes)", pickOdds: "1.55",
                bestOption1: "Opsi 1 (BTTS): Both Teams To Score (Yes) - Odds 1.55",
                bestOption2: "Opsi 2 (Over): Over 2.5 Total Goals - Odds 1.62",
                scoreMain: "2 - 2", scoreAlt: "3 - 2",
                motivation: "Kedua tim sama-sama tidak suka bertahan dan ingin memenangkan laga.",
                htStrategy: "Laga terbuka cepat tanpa banyak kompromi bertahan.",
                htPossession: "49% vs 51%", htShotsOnTarget: "3 vs 3", htCorners: "3 vs 3", htExpectedGoals: "0.80 vs 0.80"
            }
        ];

        function renderMatches() {
            const grid = document.getElementById("match-grid");
            grid.innerHTML = matchesData.map(m => `
                <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 flex flex-col justify-between hover:border-emerald-500/40 transition">
                    <div>
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-[10px] uppercase font-bold bg-slate-800 text-emerald-400 px-2 py-0.5 rounded border border-slate-700">${m.league}</span>
                            <span class="text-xs font-black text-amber-400 bg-amber-950/60 px-2 py-0.5 rounded border border-amber-500/30">${m.time}</span>
                        </div>
                        <h3 class="text-base font-bold text-slate-100 mb-1">${m.home} vs ${m.away}</h3>
                        <div class="text-[11px] font-mono text-emerald-400/80 mb-3">Odds 1X2: ${m.odds}</div>

                        <!-- Button Buka Statistik & HT -->
                        <button onclick="openModal(${m.id})" class="w-full mb-3 py-2 bg-emerald-950 hover:bg-emerald-900 text-emerald-300 font-bold text-xs rounded-xl border border-emerald-500/30 transition flex items-center justify-center space-x-1">
                            <span>Buka Statistik & Deep Data Babak 1</span>
                        </button>

                        <div class="space-y-2 text-[11px]">
                            <!-- BTTS -->
                            <div class="bg-slate-950/80 p-2.5 rounded-xl border border-slate-800">
                                <div class="flex justify-between font-bold mb-0.5">
                                    <span class="text-slate-400">BTTS ANALYTICS:</span>
                                    <span class="text-emerald-400">${m.btts}</span>
                                </div>
                                <p class="text-slate-300">${m.bttsDesc}</p>
                            </div>

                            <!-- BEST OPINIONS (2 OPSI) -->
                            <div class="bg-slate-950/90 p-2.5 rounded-xl border border-emerald-500/20">
                                <span class="text-[10px] font-extrabold text-amber-400 uppercase tracking-wider block mb-1">BEST OPINION (2 OPSI AKURAT):</span>
                                <div class="text-[11px] font-semibold text-emerald-300 mb-1">• ${m.bestOption1}</div>
                                <div class="text-[11px] font-semibold text-cyan-300">• ${m.bestOption2}</div>
                            </div>

                            <!-- PREDIKSI SKOR UTAMA & ALTERNATIF -->
                            <div class="bg-slate-950/80 p-2.5 rounded-xl border border-slate-800">
                                <div class="flex justify-between items-center">
                                    <span class="font-bold text-slate-400">PREDIKSI SKOR:</span>
                                    <div class="space-x-1">
                                        <span class="text-xs font-black text-amber-300 bg-amber-950/60 px-2 py-0.5 rounded border border-amber-500/30">Utama: ${m.scoreMain}</span>
                                        <span class="text-xs font-bold text-slate-300 bg-slate-800 px-2 py-0.5 rounded">Alt: ${m.scoreAlt}</span>
                                    </div>
                                </div>
                                <p class="text-[10px] text-slate-400 mt-1">Motivasi: ${m.motivation}</p>
                            </div>
                        </div>
                    </div>

                    <!-- PICK SAFETY -->
                    <div class="bg-gradient-to-br from-emerald-950 to-slate-900 border border-emerald-500/40 rounded-xl p-3.5 mt-4">
                        <div class="flex justify-between items-center mb-1">
                            <span class="text-[10px] font-black text-emerald-950 bg-emerald-400 px-2 py-0.5 rounded">PICK 99% SAFETY</span>
                            <span class="text-xs font-black text-amber-300">Odds ${m.pickOdds}</span>
                        </div>
                        <div class="text-xs font-extrabold text-slate-100 tracking-wide mt-1">${m.pick}</div>
                    </div>
                </div>
            `).join('');
        }

        function openModal(id) {
            const m = matchesData.find(x => x.id === id);
            if(!m) return;

            const content = document.getElementById("modal-content");
            content.innerHTML = `
                <div class="border-b border-emerald-500/30 pb-3 mb-4">
                    <span class="text-[10px] uppercase font-bold bg-slate-800 text-emerald-400 px-2 py-0.5 rounded">${m.league}</span>
                    <h2 class="text-lg font-black text-white mt-1">${m.home} vs ${m.away}</h2>
                    <p class="text-xs text-slate-400">Analisis Deep Data & Taktik Babak Pertama (HT)</p>
                </div>

                <div class="space-y-4 text-xs">
                    <div class="bg-slate-950 p-4 rounded-xl border border-slate-800">
                        <h4 class="font-bold text-emerald-400 mb-2">METRIK STATISTIK BABAK PERTAMA (ESTIMASI HT):</h4>
                        <div class="grid grid-cols-2 gap-2 text-slate-300 font-mono">
                            <div>• Penguasaan Bola: <span class="text-white">${m.htPossession}</span></div>
                            <div>• Tembakan On Target: <span class="text-white">${m.htShotsOnTarget}</span></div>
                            <div>• Corner HT: <span class="text-white">${m.htCorners}</span></div>
                            <div>• Expected Goals (xG): <span class="text-white">${m.htExpectedGoals}</span></div>
                        </div>
                    </div>

                    <div class="bg-slate-950 p-4 rounded-xl border border-slate-800">
                        <h4 class="font-bold text-amber-400 mb-1">ANALISIS & STRATEGI BABAK PERTAMA:</h4>
                        <p class="text-slate-300 leading-relaxed">${m.htStrategy}</p>
                    </div>

                    <div class="bg-slate-950 p-4 rounded-xl border border-slate-800 space-y-2">
                        <h4 class="font-bold text-cyan-400 mb-1">RANGKUMAN PREDIKSI:</h4>
                        <div>• <b>Best Opinion Opsi 1:</b> ${m.bestOption1}</div>
                        <div>• <b>Best Opinion Opsi 2:</b> ${m.bestOption2}</div>
                        <div>• <b>Prediksi Skor Akhir:</b> ${m.scoreMain} (Alternatif: ${m.scoreAlt})</div>
                    </div>
                </div>
            `;
            document.getElementById("stat-modal").classList.remove("hidden");
        }

        function closeModal() {
            document.getElementById("stat-modal").classList.add("hidden");
        }

        renderMatches();
    </script>
</body>
</html>
