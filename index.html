    body { background-color: #090d16; color: #f1f5f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

    .card-match:hover { border-color: #3b82f6; transform: translateY(-2px); box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.1); }
    .badge-sengit { background-color: #dc2626; color: #fff; }

    </div>

    function renderMatches(data) {
      const container = document.getElementById('match-container');
      container.innerHTML = '';

      data.forEach(m => {
        const isSengit = m.intensitas === "Sengit";
        const badgeClass = isSengit ? "badge-sengit" : "badge-biasa";
        const safeBadge = m.isSafe ? `<span class="bg-purple-600 text-xs px-2 py-1 rounded font-bold ml-2">🛡️ SAFE PICK</span>` : '';

        const card = `
          <div class="card-match p-5 rounded-xl flex flex-col justify-between">
            <div>
              <!-- HEADER -->
              <div class="flex justify-between items-center mb-3">
                <span class="text-xs text-blue-400 font-semibold">${m.league}</span>
                <div>
                  <span class="text-xs px-2 py-1 rounded font-bold ${badgeClass}">${m.intensitas}</span>
                  ${safeBadge}
                </div>
              </div>

              <!-- TEAMS & ODDS -->
              <div class="flex justify-between items-center my-3 bg-slate-900/80 p-3 rounded-lg border border-slate-800">
                <div class="font-bold text-sm text-white w-2/5">${m.home}</div>
                <div class="text-xs text-slate-500 font-bold">VS</div>
                <div class="font-bold text-sm text-white w-2/5 text-right">${m.away}</div>
              </div>

              <!-- 500-LAYERING ENGINE & LOGIKA BARU -->
              <div class="mb-3 bg-slate-900 p-3 rounded border border-slate-800">
                <span class="text-xs text-amber-400 font-bold block mb-1">🧠 Logika & Strategi Tim:</span>
                <p class="text-xs text-slate-300 mb-2">${m.logikaBaru}</p>
                
                <div class="layer-box p-2 rounded text-xs">
                  <span class="text-blue-400 font-bold">⚙️ 500-Layering Engine:</span>
                  <p class="text-slate-400 mt-0.5">${m.layering500}</p>
                </div>
              </div>

              <!-- FITUR LAMA: O/U, BTTS, 1X2, CORNER, HANDICAP -->
              <div class="grid grid-cols-2 gap-2 text-xs bg-slate-950 p-3 rounded border border-slate-900 mb-4">
                <div><span class="text-slate-500">1X2:</span> <b class="text-white">${m.odds.m1} | ${m.odds.x} | ${m.odds.m2}</b></div>
                <div><span class="text-slate-500">BTTS:</span> <b class="text-emerald-400">${m.fiturLama.btts}</b></div>
                <div><span class="text-slate-500">O/U:</span> <b class="text-amber-400">${m.fiturLama.overUnder}</b></div>
                <div><span class="text-slate-500">HT Result:</span> <b class="text-white">${m.fiturLama.htResult}</b></div>
                <div><span class="text-slate-500">Corner:</span> <b class="text-blue-300">${m.fiturLama.corners}</b></div>
                <div><span class="text-slate-500">Handicap:</span> <b class="text-purple-300">${m.fiturLama.handicap}</b></div>
              </div>
            </div>

            <button onclick="toggleParlay(${m.id})" id="btn-${m.id}" class="w-full bg-slate-800 hover:bg-blue-600 text-white font-bold py-2 rounded text-xs transition">
              + Tambah ke Parlay
            </button>
          </div>
        `;
        container.innerHTML += card;
      });
    }

    let selectedParlay = [];
    function toggleParlay(id) {
      const btn = document.getElementById(`btn-${id}`);
      if (selectedParlay.includes(id)) {
        selectedParlay = selectedParlay.filter(i => i !== id);
        btn.innerText = "+ Tambah ke Parlay";
        btn.classList.remove('bg-emerald-600');
        btn.classList.add('bg-slate-800');
      } else {
        selectedParlay.push(id);
        btn.innerText = "✓ Masuk Parlay";
        btn.classList.remove('bg-slate-800');
        btn.classList.add('bg-emerald-600');
      }
      document.getElementById('parlay-count').innerText = `${selectedParlay.length} Tim`;
    }

    function filterMatch(type) {
      if (type === 'all') renderMatches(matchesData);
      else if (type === 'sengit') renderMatches(matchesData.filter(m => m.intensitas === 'Sengit'));
      else if (type === 'biasa') renderMatches(matchesData.filter(m => m.intensitas === 'Biasa'));
      else if (type === 'safe') renderMatches(matchesData.filter(m => m.isSafe));
    }

    function searchMatch() {
      const query = document.getElementById('search-input').value.toLowerCase();
      renderMatches(matchesData.filter(m => m.home.toLowerCase().includes(query) || m.away.toLowerCase().includes(query) || m.league.toLowerCase().includes(query)));
    }

    renderMatches(matchesData);
  </script>
