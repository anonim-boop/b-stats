    <style>

    <!-- Main Container -->

                <button onclick="filterLeague('England')" class="px-3.5 py-1.5 text-xs font-bold rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700 transition">Inggris</button>
                <button onclick="filterLeague('Germany')" class="px-3.5 py-1.5 text-xs font-bold rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700 transition">Jerman</button>
                <button onclick="filterLeague('Spain')" class="px-3.5 py-1.5 text-xs font-bold rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700 transition">Spanyol</button>
                <button onclick="filterLeague('Italy')" class="px-3.5 py-1.5 text-xs font-bold rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700 transition">Italia</button>
                <button onclick="filterLeague('Russia')" class="px-3.5 py-1.5 text-xs font-bold rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700 transition">Rusia</button>
                <button onclick="filterLeague('France')" class="px-3.5 py-1.5 text-xs font-bold rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700 transition">Prancis</button>

        <!-- Cards Match Grid -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6" id="match-grid">

    </main>

    <!-- Modal Popup Detail Statistik & Analisis HT -->

        <div class="bg-slate-900 border border-emerald-500/40 rounded-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto p-6 shadow-2xl relative">

            }

        let currentFilter = 'ALL';

        function filterLeague(type) {
            currentFilter = type;
            const buttons = document.querySelectorAll('#filter-container button');
            buttons.forEach(btn => {
                if(btn.textContent.includes(type === 'ALL' ? 'Semua' : (type === 'England' ? 'Inggris' : type === 'Germany' ? 'Jerman' : type === 'Spain' ? 'Spanyol' : type === 'Italy' ? 'Italia' : type === 'Russia' ? 'Rusia' : 'Prancis'))) {
                    btn.className = "px-3.5 py-1.5 text-xs font-bold rounded-lg bg-emerald-500 text-slate-950 transition";
                } else {
                    btn.className = "px-3.5 py-1.5 text-xs font-bold rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700 transition";
                }
            });
            renderMatches();
        }

        function renderMatches() {
            const grid = document.getElementById("match-grid");
            const filtered = currentFilter === 'ALL' ? matchesData : matchesData.filter(m => m.tag === currentFilter);
            
            grid.innerHTML = filtered.map(m => `
                <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 flex flex-col justify-between hover:border-emerald-500/40 transition">
                    <div>
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-[10px] uppercase font-bold bg-slate-800 text-emerald-400 px-2.5 py-0.5 rounded border border-slate-700">${m.league}</span>
                            <span class="text-xs font-black text-amber-400 bg-amber-950/60 px-2 py-0.5 rounded border border-amber-500/30">${m.time}</span>
                        </div>
                        <h3 class="text-base font-bold text-slate-100 mb-1">${m.home} vs ${m.away}</h3>
                        <div class="text-[11px] font-mono text-emerald-400/80 mb-2">Odds 1X2: ${m.odds}</div>

                        <!-- Fitur VIP: Akurasi & Risk Control -->
                        <div class="grid grid-cols-2 gap-2 mb-3 text-[10px]">
                            <div class="bg-slate-950 px-2 py-1 rounded border border-slate-800 text-emerald-300">Akurasi AI: <b>${m.confidence}</b></div>
                            <div class="bg-slate-950 px-2 py-1 rounded border border-slate-800 text-cyan-300">Volatilitas: <b>${m.volatility}</b></div>
                        </div>

                        <!-- Button Modal Popup Statistik HT -->
                        <button onclick="openModal(${m.id})" class="w-full mb-3 py-2 bg-emerald-950 hover:bg-emerald-900 text-emerald-300 font-bold text-xs rounded-xl border border-emerald-500/30 transition flex items-center justify-center space-x-1">
                            <span>Buka Deep Data & Analisis HT</span>
                        </button>

                        <div class="space-y-2 text-[11px]">
                            <!-- BTTS -->
                            <div class="bg-slate-950/80 p-2.5 rounded-xl border border-slate-800">
                                <div class="flex justify-between font-bold mb-0.5">
                                    <span class="text-slate-400">BTTS ANALYTICS:</span>
                                    <span class="text-emerald-400">${m.btts}</span>
                                </div>
                                <p class="text-slate-300">${m.bttsDesc}</p>
                            </div>

                            <!-- BEST OPINIONS (2 OPSI SUPER SAFETY) -->
                            <div class="bg-slate-950/90 p-2.5 rounded-xl border border-emerald-500/20">
                                <span class="text-[10px] font-extrabold text-amber-400 uppercase tracking-wider block mb-1">BEST OPINION (STANDAR & SAFE):</span>
                                <div class="text-[11px] font-semibold text-emerald-300 mb-1">• ${m.bestOption1}</div>
                                <div class="text-[11px] font-semibold text-cyan-300">• ${m.bestOption2}</div>
                            </div>

                            <!-- PREDIKSI SKOR UTAMA & ALTERNATIF -->
                            <div class="bg-slate-950/80 p-2.5 rounded-xl border border-slate-800">
                                <div class="flex justify-between items-center">
                                    <span class="font-bold text-slate-400">PREDIKSI SKOR:</span>
                                    <div class="space-x-1">
                                        <span class="text-xs font-black text-amber-300 bg-amber-950/60 px-2 py-0.5 rounded border border-amber-500/30">Utama: ${m.scoreMain}</span>
                                        <span class="text-xs font-bold text-slate-300 bg-slate-800 px-2 py-0.5 rounded">Alt: ${m.scoreAlt}</span>
                                    </div>
                                </div>
                                <p class="text-[10px] text-slate-400 mt-1">Saran Risk: ${m.riskManagement}</p>
                            </div>
                        </div>
                    </div>

                    <!-- PICK SAFETY -->
                    <div class="bg-gradient-to-br from-emerald-950 to-slate-900 border border-emerald-500/40 rounded-xl p-3.5 mt-4">
                        <div class="flex justify-between items-center mb-1">

                        <div class="text-xs font-extrabold text-slate-100 tracking-wide mt-1">${m.pick}</div>
                    </div>
                </div>
            `).join('');
        }

        function openModal(id) {
            const m = matchesData.find(x => x.id === id);
            if(!m) return;

            const content = document.getElementById("modal-content");
            content.innerHTML = `
                <div class="border-b border-emerald-500/30 pb-3 mb-4">
                    <span class="text-[10px] uppercase font-bold bg-slate-800 text-emerald-400 px-2.5 py-0.5 rounded">${m.league}</span>
                    <h2 class="text-lg font-black text-white mt-1">${m.home} vs ${m.away}</h2>
                    <p class="text-xs text-slate-400">Analisis Deep Data & Taktik Babak Pertama (HT)</p>
                </div>

                <div class="space-y-4 text-xs">
                    <div class="bg-slate-950 p-4 rounded-xl border border-slate-800">
                        <h4 class="font-bold text-emerald-400 mb-2">METRIK STATISTIK BABAK PERTAMA (ESTIMASI HT):</h4>
                        <div class="grid grid-cols-2 gap-2 text-slate-300 font-mono">
                            <div>• Penguasaan Bola: <span class="text-white">${m.htPossession}</span></div>
                            <div>• Tembakan On Target: <span class="text-white">${m.htShotsOnTarget}</span></div>
                            <div>• Corner HT: <span class="text-white">${m.htCorners}</span></div>
                            <div>• Expected Goals (xG): <span class="text-white">${m.htExpectedGoals}</span></div>
                        </div>
                    </div>

                    <div class="bg-slate-950 p-4 rounded-xl border border-slate-800">
                        <h4 class="font-bold text-amber-400 mb-1">STRATEGI TAKTIKAL & ALUR BOLA:</h4>
                        <p class="text-slate-300 leading-relaxed mb-2">${m.htStrategy}</p>
                        <div class="text-slate-400">• Tipe Taktik: <span class="text-white font-semibold">${m.tactic}</span></div>
                        <div class="text-slate-400">• Kontrol Lini Tengah: <span class="text-white font-semibold">${m.midfieldControl}</span></div>
                        <div class="text-slate-400">• Bahaya Set-Piece: <span class="text-white font-semibold">${m.setPieceRisk}</span></div>
                    </div>

                    <div class="bg-slate-950 p-4 rounded-xl border border-slate-800 space-y-2">
                        <h4 class="font-bold text-cyan-400 mb-1">RANGKUMAN REKOMENDASI ULTRA SAFETY:</h4>
                        <div>• <b>Best Opinion Opsi 1:</b> ${m.bestOption1}</div>
                        <div>• <b>Best Opinion Opsi 2:</b> ${m.bestOption2}</div>
                        <div>• <b>Prediksi Skor Akhir:</b> ${m.scoreMain} (Alternatif: ${m.scoreAlt})</div>
                        <div>• <b>Manajemen Risiko:</b> ${m.riskManagement}</div>
                    </div>
                </div>
            `;
            document.getElementById("stat-modal").classList.remove("hidden");
        }

        function closeModal() {
            document.getElementById("stat-modal").classList.add("hidden");
        }

</body>
</html>
